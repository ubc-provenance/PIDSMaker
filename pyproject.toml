[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pidsmaker"
version = "5.0.0"
description = "Intrusion detection framework based on deep learning"
authors = [{name = "Tristan Bilot"}, {name = "Thomas Pasquier"}]
readme = "README.md"
license = {file = "LICENSE"}
# torch 2.1 has wheels up to Python 3.11
requires-python = ">= 3.9, < 3.12"
# The versions tested by the CI (results depend on them). torch is installed from PyPI with CUDA
# 12.1 on Linux: install it first from https://download.pytorch.org/whl/cpu for a CPU-only build.
# The PyG extensions (torch_scatter, ...) are optional: see the installation docs.
dependencies = [
    "torch==2.1.2",
    "torch_geometric==2.6.1",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "pandas==2.3.3",
    "networkx==3.2.1",
    "igraph==0.11.5",
    "gensim==4.4.0",
    "nltk==3.8.1",
    "transformers==4.39.3",
    "duckdb>=1.1,<2",
    "pyarrow==21.0.0",  # tested with NumPy 1.26 (recent versions need NumPy 2)
    "huggingface_hub>=0.23,<1.0",
    "matplotlib>=3.7",
    "wandb>=0.16",
    "yacs==0.1.8",
    "pyyaml",
    "pytz",
    "psutil",
    "tqdm",
    "wget==3.2",
    "flask>=2.2",
]

[project.optional-dependencies]
# Embedding visualizations (vizgen)
viz = ["umap-learn==0.5.6"]
test = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pytest-xdist==3.6.1",
]

[project.scripts]
pidsmaker = "pidsmaker.cli:main"

[project.urls]
Homepage = "https://github.com/ubc-provenance/PIDSMaker"
Documentation = "https://ubc-provenance.github.io/PIDSMaker/"

# config/ and Ground_Truth/ (at the root of the repository) are copied into the wheel as
# pidsmaker/resources/ by setup.py
[tool.setuptools.packages.find]
include = ["pidsmaker*"]

[tool.setuptools.package-data]
"pidsmaker.vizgen.web" = ["*.html", "static/**/*"]

[tool.ruff]
line-length = 100
indent-width = 4
lint.select = ["W", "I001"]
exclude = [
    ".svg",
    ".ipynb",
    ".json",
    ".csv"
]
lint.isort.known-first-party = ["pidsmaker"]
lint.isort.known-third-party = ["wandb", "torch", "numpy"]
lint.isort.section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
