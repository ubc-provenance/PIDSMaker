services:
  pids:
    build:
      context: .
    container_name: ${COMPOSE_PROJECT_NAME}-pids
    networks:
      - shared_network
    ports:
      # Host ports can be changed in .env, e.g. on macOS where AirPlay Receiver uses port 5000
      - "${PIDS_PORT:-8000}:8000"
      - "${VIZ_PORT:-5000}:5000"  # viz port
    environment:
      DB_HOST: postgres
      DOCKER_PORT: ${DOCKER_PORT:-5432}
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./:/home/pids
      - ${ARTIFACTS_DIR:-/home/artifacts}:/home/artifacts
      # - /path/to/raw/data:/data
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  shared_network:
    external:
      name: shared_network
