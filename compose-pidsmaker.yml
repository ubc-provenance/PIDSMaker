services:
  pids:
    build:
      context: .
    container_name: ${COMPOSE_PROJECT_NAME}-pids
    ports:
      # Host ports can be changed in .env, e.g. on macOS where AirPlay Receiver uses port 5000
      - "${PIDS_PORT:-8000}:8000"
      - "${VIZ_PORT:-5000}:5000"  # viz port
    environment:
      # Datasets downloaded by `pidsmaker download` (or at the first run), kept in the artifacts
      # volume rather than in the container
      PIDSMAKER_DATASETS_DIR: /home/artifacts/datasets/parquet
    volumes:
      - ./:/home/pids
      - ${ARTIFACTS_DIR:-/home/artifacts}:/home/artifacts
      # - /path/to/raw/data:/data
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
