# PIDSMaker documentation, built with Zensical (https://zensical.org).
#
#   pip install zensical
#   cd docs && zensical serve      # live preview on http://127.0.0.1:8000
#   cd docs && zensical build      # static site in docs/site/

[project]
site_name = "PIDSMaker"
site_description = "A framework to build, benchmark and extend graph-based intrusion detection systems on provenance and network data (PIDSs and NIDSs)."
site_author = "UBC Provenance team"
site_url = "https://ubc-provenance.github.io/PIDSMaker/"
repo_url = "https://github.com/ubc-provenance/PIDSMaker"
repo_name = "ubc-provenance/PIDSMaker"
edit_uri = "edit/main/docs/docs/"
copyright = "Copyright &copy; 2025&ndash;2026 UBC Provenance team &middot; MIT License"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation (Docker)" = "getting-started/installation.md" },
    { "Installation (Apptainer)" = "getting-started/apptainer.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Building datasets from scratch" = "getting-started/from-scratch.md" },
  ] },
  { "User guide" = [
    { "Background" = "guide/background.md" },
    { "Pipeline" = "guide/pipeline.md" },
    { "Systems" = "guide/systems.md" },
    { "Datasets" = "guide/datasets.md" },
    { "Evaluation & labeling" = "guide/evaluation.md" },
    { "Tutorial: a new system" = "guide/tutorial.md" },
  ] },
  { "Features" = [
    { "Hyperparameter tuning" = "features/tuning.md" },
    { "Instability" = "features/instability.md" },
    { "Batching & sampling" = "features/batching.md" },
    { "Pretrained encoders" = "features/pretrained_encoders.md" },
    { "Supervised fine-tuning" = "features/supervised.md" },
    { "Multi-dataset training" = "features/multi-dataset.md" },
    { "Adversarial attacks" = "features/attacks.md" },
    { "Triage" = "features/triage.md" },
    { "Embedding visualizer" = "features/visualization.md" },
  ] },
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Tasks" = "reference/tasks.md" },
    { "Cleaning" = "reference/cleaning.md" },
    { "Featurization" = "reference/featurization.md" },
    { "Encoders" = "reference/encoders.md" },
    { "Decoders" = "reference/decoders.md" },
    { "Objectives" = "reference/objectives.md" },
  ] },
  { "Community" = [
    { "Contributing" = "community/contributing.md" },
    { "FAQ & troubleshooting" = "community/faq.md" },
    { "Release notes" = "https://github.com/ubc-provenance/PIDSMaker/releases" },
  ] },
]

[project.theme]
logo = "assets/pidsmaker_new.png"
favicon = "assets/pidsmaker.ico"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ubc-provenance/PIDSMaker"
name = "PIDSMaker on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/jecmkTABUg"
name = "Join the PIDSMaker Discord"

# Old URLs, kept so that links to the previous layout of the docs still work.
[project.plugins.redirects.redirect_maps]
"ten-minute-install.md" = "getting-started/installation.md"
"singularity_install.md" = "getting-started/apptainer.md"
"introduction.md" = "getting-started/quickstart.md"
"create-db-from-scratch.md" = "getting-started/from-scratch.md"
"download-files.md" = "getting-started/from-scratch.md#downloading-the-files-manually"
"pipeline.md" = "guide/pipeline.md"
"datasets.md" = "guide/datasets.md"
"tuned_systems.md" = "features/instability.md"
"tutorial.md" = "guide/tutorial.md"
"config/tasks.md" = "reference/tasks.md"
"config/cleaning.md" = "reference/cleaning.md"
"config/featurization.md" = "reference/featurization.md"
"config/encoders.md" = "reference/encoders.md"
"config/decoders.md" = "reference/decoders.md"
"config/objectives.md" = "reference/objectives.md"
"contributing.md" = "community/contributing.md"
"guide/network.md" = "guide/systems.md"

[project.plugins.glightbox]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "ubc-provenance"
pymdownx.magiclink.repo = "PIDSMaker"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Generated argument lists (docs/scripts/args/) are included with --8<--
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
