name: discord-release
# Announces a release on Discord: when a release is published from the GitHub page, or when
# publish.yml creates one.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord #announcements
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,url,body > release.json
          NAME=$(jq -r '.name // ""' release.json)
          URL=$(jq -r '.url' release.json)
          BODY=$(jq -r '.body // ""' release.json)
          # Release names start with "PIDSMaker" (e.g. "PIDSMaker 5.0.0")
          TITLE="${NAME:-$TAG}"
          case "$TITLE" in PIDSMaker*) ;; *) TITLE="PIDSMaker ${TITLE}" ;; esac
          # Discord embed descriptions are capped at 4096 characters
          DESC=$(printf '%s' "$BODY" | head -c 3500)
          if [ ${#BODY} -gt 3500 ]; then DESC="$DESC"$'\n\n…full notes on GitHub'; fi
          jq -n \
            --arg title "${TITLE} released" \
            --arg url "$URL" \
            --arg desc "$DESC" \
            '{
              content: "A new version of PIDSMaker is out!",
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 15559215
              }]
            }' > payload.json
          curl -sSf -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"
