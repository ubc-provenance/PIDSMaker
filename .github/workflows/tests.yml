name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest versions supported by torch 2.1
        python-version: ["3.9", "3.11"]
    env:
      # One thread per pytest-xdist worker
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # As users install it: the package (not editable) with the dependencies of pyproject.toml,
      # without Postgres and the PyG extensions. The tests read the datasets from Parquet files.
      - name: Install PIDSMaker (CPU)
        run: |
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test]" pytest-github-actions-annotate-failures
          pip check
          # Downloaded at import time otherwise, by each worker at the same time
          python -m nltk.downloader -q punkt
          # From outside the repository, the installed package is imported
          cd /tmp && pidsmaker --help && python -c "import pidsmaker.config.pipeline as p; assert 'site-packages' in str(p.ROOT_PROJECT_PATH), p.ROOT_PROJECT_PATH"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          # `pytest` (not `python -m pytest`) does not put the repository on sys.path: the tests
          # import the installed package
          pytest tests --device cpu -n 4 --dist worksteal --durations=30 -rfE 2>&1 | tee pytest.log

      # Errors outside of the tests (collection, fixtures, crashed workers) are not annotated
      # by the plugin: the end of the output is shown as an annotation of the run instead
      - name: Report the failures
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          summary=$(grep -E "^(FAILED|ERROR)|crashed|Interrupted|=====.*(passed|failed|error)" pytest.log | tail -n 60)
          details=$(grep -vE "Warning|warnings.warn|^\s*$" pytest.log | tail -n 80)
          for text in "$summary" "$details"; do
            text="${text//'%'/'%25'}"; text="${text//$'\n'/'%0A'}"; text="${text//$'\r'/'%0D'}"
            echo "::error title=pytest::${text}"
          done

  # The legacy Postgres backend (--database_backend postgres), as long as it is supported: the
  # sample of CLEARSCOPE_E3 is loaded into this server
  pytest-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5

      # The default database host of the framework (--database_host) is `postgres`
      - name: Resolve the database host
        run: echo "127.0.0.1 postgres" | sudo tee -a /etc/hosts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PIDSMaker (CPU)
        run: |
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test,postgres]" pytest-github-actions-annotate-failures
          python -m nltk.downloader -q punkt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest tests --backend postgres --device cpu -n 4 --dist worksteal --durations=30 -rfE 2>&1 | tee pytest.log

      # Errors outside of the tests (collection, fixtures, crashed workers) are not annotated
      # by the plugin: the end of the output is shown as an annotation of the run instead
      - name: Report the failures
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          summary=$(grep -E "^(FAILED|ERROR)|crashed|Interrupted|=====.*(passed|failed|error)" pytest.log | tail -n 60)
          details=$(grep -vE "Warning|warnings.warn|^\s*$" pytest.log | tail -n 80)
          for text in "$summary" "$details"; do
            text="${text//'%'/'%25'}"; text="${text//$'\n'/'%0A'}"; text="${text//$'\r'/'%0D'}"
            echo "::error title=pytest::${text}"
          done
