name: publish
# Releases a version of PIDSMaker: builds the package, publishes it to PyPI, creates its tag and
# its GitHub release, and announces it on Discord.
#
# - Actions > publish > Run workflow, on `main`, with the version to release, which must be the
#   version of pyproject.toml. The notes of the release are `.github/releases/<version>.md` if it
#   exists, else the list of the pull requests since the previous release, generated by GitHub.
# - Publishing a release from the GitHub page also publishes it to PyPI (and discord-release.yml
#   announces it).
#
# PyPI trusts this workflow (trusted publisher of the `pidsmaker` project, with the environment
# `pypi`), so no token is needed. See https://docs.pypi.org/trusted-publishers/.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 5.0.0 (the version of pyproject.toml)"
        required: true
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run the workflow on main, not on ${GITHUB_REF_NAME}"
              exit 1
            fi
            if [ "${REQUESTED#v}" != "$version" ]; then
              echo "::error::pyproject.toml is at version ${version}, not ${REQUESTED}: change it in a pull request first"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${version}" > /dev/null; then
              echo "::error::${version} is already released (the tag ${version} exists)"
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} is not the version of pyproject.toml (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pip install build==1.2.2 twine==6.1.0
      - name: Build the source distribution and the wheel
        run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pidsmaker/
    permissions:
      id-token: write  # to authenticate to PyPI as this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a run that failed after the upload can be run again

  # Only for manual runs: otherwise, the release already exists
  release:
    needs: [build, publish]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the tag and the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes=".github/releases/${VERSION}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "PIDSMaker ${VERSION}" "${notes_args[@]}"

  # A release created by a workflow does not trigger the other workflows, such as
  # discord-release.yml: it is called here instead
  announce:
    needs: [build, release]
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ needs.build.outputs.version }}
    secrets: inherit
