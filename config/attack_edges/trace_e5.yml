# Attack edges for TRACE_E5 (Fedora Linux).
# Attack scenario: Firefox exploit → bash shell → data staged in /home/admin/eraseme →
# Thunderbird email exfiltration → sshd lateral movement.
# NTP port used as covert C2 channel.
# Subjects are existing benign nodes in the dataset.
# IMPORTANT: Labels in TRACE_E5 do NOT include the type prefix
# (unlike TRACE_E3). Subject: "cmd /binary", File: "/path", Netflow: "ip port".
# C2 IPs are plausible but distinct from actual dataset to avoid indicator memorization.

attack_edges:

  # ── Initial Access / Exploitation ──────────────────────────────────────────

  # Firefox (exploited) spawns bash — initial foothold
  - src_type: subject
    src_label: "firefox /home/admin/firefox"
    edge_type: EVENT_CLONE
    dst_type: subject
    dst_label: "-bash /home/admin/bash"

  # Firefox connects to attacker staging server
  - src_type: subject
    src_label: "firefox /home/admin/firefox"
    edge_type: EVENT_CONNECT
    dst_type: netflow
    dst_label: "185.220.101.50 80"

  # Firefox writes dropper payload to disk
  - src_type: subject
    src_label: "firefox /home/admin/firefox"
    edge_type: EVENT_WRITE
    dst_type: file
    dst_label: "/tmp/.payload"

  # Firefox writes to Mozilla session recovery (payload staging)
  - src_type: subject
    src_label: "firefox /home/admin/firefox"
    edge_type: EVENT_WRITE
    dst_type: file
    dst_label: "/home/admin/.mozilla/firefox/wyd8o2f2.default/sessionstore-backups/recovery.js.tmp"

  # Firefox reads staged data
  - src_type: subject
    src_label: "firefox /home/admin/firefox"
    edge_type: EVENT_READ
    dst_type: file
    dst_label: "/home/admin/eraseme"

  # ── Payload Execution ───────────────────────────────────────────────────────

  # Firefox dropper executed → spawns bash
  - src_type: file
    src_label: "/tmp/.payload"
    edge_type: EVENT_EXECUTE
    dst_type: subject
    dst_label: "-bash /home/admin/bash"

  # ── Backdoor / SSH Lateral Movement ─────────────────────────────────────────

  # sshd spawns bash (backdoor / lateral movement)
  - src_type: subject
    src_label: "/usr/sbin/sshd -D -R //sshd"
    edge_type: EVENT_CLONE
    dst_type: subject
    dst_label: "-bash /home/admin/bash"

  # sshd privileged daemon spawns bash
  - src_type: subject
    src_label: "/usr/sbin/sshd -D //sshd"
    edge_type: EVENT_CLONE
    dst_type: subject
    dst_label: "-bash /home/admin/bash"

  # ── C2 Communication ────────────────────────────────────────────────────────

  # bash connects to C2 via NTP covert channel
  - src_type: subject
    src_label: "-bash /home/admin/bash"
    edge_type: EVENT_CONNECT
    dst_type: netflow
    dst_label: "10.0.8.5 123"

  # bash sends data to C2 (NTP covert channel)
  - src_type: subject
    src_label: "-bash /home/admin/bash"
    edge_type: EVENT_SENDTO
    dst_type: netflow
    dst_label: "10.0.8.5 123"

  # C2 sends commands back via NTP channel
  - src_type: netflow
    src_label: "10.0.8.5 123"
    edge_type: EVENT_RECVFROM
    dst_type: subject
    dst_label: "-bash /home/admin/bash"

  # bash connects to HTTP staging server
  - src_type: subject
    src_label: "-bash /home/admin/bash"
    edge_type: EVENT_CONNECT
    dst_type: netflow
    dst_label: "185.220.101.50 80"

  # bash connects to HTTPS C2 (encrypted)
  - src_type: subject
