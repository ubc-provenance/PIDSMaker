    src_label: "subject firefox /home/admin/firefox"
    edge_type: EVENT_WRITE
    dst_type: file
    dst_label: "file /home/admin/.mozilla/firefox/wyd8o2f2.default/sessionstore-backups/recovery.js.tmp"

