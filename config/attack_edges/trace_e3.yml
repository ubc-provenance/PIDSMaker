# Attack edges for TRACE_E3 (Fedora Linux).
# Attack scenario: Firefox exploit via drive-by download → bash shell spawned →
# data staged in /home/admin/eraseme → Thunderbird email exfiltration →
# sshd used for lateral movement. NTP port used as covert C2 channel.
# Subjects are existing benign nodes (Firefox, bash, sshd, Thunderbird, pine, wget).
# C2 IPs are plausible but distinct from actual dataset to avoid indicator memorization.

attack_edges:

  # ── Initial Access / Exploitation ──────────────────────────────────────────

  # Firefox (exploited via drive-by download) spawns bash — initial foothold
  - src_type: subject
    src_label: "subject firefox /home/admin/firefox"
    edge_type: EVENT_CLONE
    dst_type: subject
    dst_label: "subject -bash /home/admin/bash"

  # Firefox connects to attacker staging server
  - src_type: subject
    src_label: "subject firefox /home/admin/firefox"
    edge_type: EVENT_CONNECT
    dst_type: netflow
    dst_label: "netflow 185.220.101.50 80"

  # Firefox writes dropper payload to disk
  - src_type: subject
    src_label: "subject firefox /home/admin/firefox"
    edge_type: EVENT_WRITE
    dst_type: file
    dst_label: "file /tmp/.payload"

  # Firefox writes to Mozilla session recovery (payload staging)
