method: grid


parameters:
  training.lr:
    values: [0.001, 0.0001]
  training.node_hid_dim:
    values: [128, 256]
  training.node_out_dim:
    values: [-1]
  training.num_epochs:
    values: [12]
  training.encoder.tgn.tgn_memory_dim:
    values: [-1]
  training.encoder.tgn.tgn_time_dim:
    values: [-1]
  # training.encoder.graph_attention.flow:
  #   values: [source_to_target, target_to_source]
  training.encoder.used_methods:
    values: [entity_type_encoding-tgn-graph_attention, tgn-graph_attention]
  featurization.used_method:
    values: [only_ones, word2vec]
  batching.edge_features:
    values: [edge_type, edge_type_triplet]
  batching.intra_graph_batching.tgn_last_neighbor.directed:
    values: [False, True]
