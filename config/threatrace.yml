construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  node_label_features:
    subject: type, path, cmd_line
    file: type, path
    netflow: type, remote_ip, remote_port
  multi_dataset: none
  cleaning:
    used_methods: none
transformation:
  used_methods: none

featurization:
  used_method: only_type
  tokenization:
    used_method: none
feat_inference:
  to_remove: True

batching:
  save_on_disk: False
  node_features: edges_distribution
  edges_distribution_scaling: none
  edge_features: none
  fix_buggy_graph_reindexer: True
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: none
  inter_graph_batching:
    used_method: none
training:
  used_method: threatrace
  seed: 0
  deterministic: False
  num_epochs: 12
  patience: 3
  lr: 0.01
  weight_decay: 0.0005
  node_hid_dim: 32
  node_out_dim: 3
  grad_accumulation: 1
  threatrace:
    ratio_threshold: 1.5  # `thre` of CADETS and THEIA in the original
    max_submodels: 100
    max_retrain_epochs: 149
    retrain_loss_threshold: 1.0
    max_rounds_without_progress: 3
  encoder:
    dropout: 0.5
    used_methods: sage
    sage:
      activation: relu
      num_layers: 2
  decoder:
    used_methods: predict_node_type
    predict_node_type:
      decoder: none
      balanced_loss: False

evaluation:
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_adp
  used_method: node_evaluation
  node_evaluation:
    threshold_method: threatrace
    use_kmeans: False
