construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  node_label_features:
    subject: path, cmd_line
    file: path
    netflow: remote_ip
  multi_dataset: none
  cleaning:
    used_methods: none
transformation:
  used_methods: rcaid_pseudo_graph
  rcaid_pseudo_graph:
    use_pruning: True
    prune_threshold: 0.5
    root_node_types: file, netflow
    keep_original_edges: True
    merge_same_label_roots: True
    max_roots_per_node: 16

featurization:
  epochs: 5
  emb_dim: 128
  seed: 0
  training_split: all
  used_method: doc2vec
  tokenization:
    used_method: nltk
    nltk:
      type_aware: True
      substitutions: none
  doc2vec:
    include_neighbors: False
    truncate_process_name: True
    alpha: 0.025
    workers: 1
feat_inference:
  to_remove: True

batching:
  save_on_disk: False
  node_features: node_emb
  edge_features: none
  fix_buggy_graph_reindexer: False
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: none
  inter_graph_batching:
    used_method: none
training:
  used_method: default
  seed: 0
  deterministic: False
  num_epochs: 12
  patience: 3
  lr: 0.0001
  weight_decay: 0.0001
  node_hid_dim: 128
  node_out_dim: 128
  grad_accumulation: 1
  encoder:
    dropout: 0.5
    used_methods: rcaid_gat
    rcaid_gat:
      num_layers: 2
      num_heads: 1
  decoder:
    used_methods: predict_process_tag
    predict_process_tag:
      decoder: node_mlp
      balanced_loss: False
      detection: kmeans
      node_mlp:
        architecture_str: none

evaluation:
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_adp
  used_method: node_evaluation
  node_evaluation:
    threshold_method: max_val_loss
    use_kmeans: False
