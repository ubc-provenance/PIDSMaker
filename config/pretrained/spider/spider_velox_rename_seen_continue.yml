# Renaming-attack experiment 3 (auto-seen target + continue-pretrain):
# Same auto-seen rename setup as experiment 2, but the SPIDER model is
# continue-pretrained on CADETS_E3 first. The benign target embeddings used
# for the swap are therefore refined to match this site's actual benign
# behavior — sharpening the embedding-vs-edge-behavior mismatch the
# downstream GNN can exploit when an attacker mimics those benign processes.
#
# Run:  python -m pidsmaker.main spider_velox_rename_seen_continue --dataset CADETS_E3

_include_yml: spider_velox

feat_inference:
  continue_pretrain: True
  continue_pretrain_epochs: 10
  continue_pretrain_lr_factor: 0.1
  rename_attack:
    enabled: True
    entities: "main, pEja72mA, XIM, tmux-1002, font, sendmail"
    target_node_type: subject
    top_k: 100
    target_label: ""
    seed: 0
