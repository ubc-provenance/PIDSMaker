# Jbeil (Khoury et al., IEEE S&P 2024): "Jbeil: Temporal Graph-Based Inductive Learning to Infer
# Lateral Movement in Evolving Enterprise Networks". A TGN (node memory + graph attention over
# temporal neighbors) trained by self-supervised link prediction against random negative edges.
# Edges with a low probability are anomalous.
#
# As in TGN and Jbeil, each edge is contrasted with a negative edge from its source to a random
# destination of the dataset, embedded by the TGN with the edges of the batch
# (`negative_destinations`, `neg_sampling: tgn`), and the best epoch is selected by link
# prediction on the validation set.
#
# Differences with the original implementation (https://github.com/surender08/Jbeil, a mirror of
# the original repository):
# - Jbeil's edges carry 9 unique-neighbor counts computed on the whole log (test days included)
#   as features, which are not used (node features are the node type, zeros in Jbeil);
# - the paper's results are link prediction metrics of all test edges (malicious ones included)
#   against random negatives, binarized per batch; here, malicious edges are detected among the
#   test edges by their score, and the data is split by days instead of 70/15/15 quantiles;
# - Jbeil also trains on synthetic lateral movement events (not released), which are not used.

_include_yml: kairos

featurization:
  used_method: only_type
  tokenization:
    used_method: none

batching:
  node_features: node_type
  edge_features: msg,time_encoding
  intra_graph_batching:
    used_methods: edges, tgn_last_neighbor
    edges:
      intra_graph_batch_size: 200
    tgn_last_neighbor:
      tgn_neighbor_size: 10
      negative_destinations: True
      # Kept continuous across days (Kairos resets them every day)
      reset_state_every_day: False

training:
  encoder:
    # Not Kairos' 8 heads and final ReLU
    graph_attention:
      num_heads: 4
      final_activation: False
  num_epochs: 10
  patience: 5
  lr: 0.0001
  decoder:
    used_methods: predict_edge_contrastive
    predict_edge_contrastive:
      neg_sampling: tgn
      decoder: edge_mlp
      edge_mlp:
        architecture_str: linear(0.5) | relu
        src_dst_projection_coef: 1

evaluation:
  # Disabled until the NIDS reach their published performance (one point per edge is slow)
  save_figures: False
  best_model_selection: best_val_score
  used_method: edge_evaluation
  edge_evaluation:
    malicious_edge_selection: both_nodes
    threshold_method: max_val_loss
