# ProGrapher (Yang et al., USENIX Security 2023): "PROGRAPHER: An Anomaly Detection System based on
# Provenance Graph Embedding". The provenance stream is cut into snapshots, each embedded as a whole
# by graph2vec: the Weisfeiler-Lehman rooted subgraphs (RSGs) of all nodes, built from node and
# edge types only, are the words of a document (the snapshot) embedded with doc2vec (PV-DBOW).
# A TextRCNN (bidirectional RNN + max-pooling) predicts the embedding of each snapshot from those
# of the previous L snapshots, and snapshots whose actual embedding is far (L2) from the
# prediction are anomalous. Key indicators are the nodes rooted at the RSGs that explain the
# deviation the most: RSGs r are ranked by w_r . (E - E'), the difference of their log-likelihood
# (Eq. 1) under the actual (E) and the predicted (E') embeddings.
#
# Components: `graph2vec` featurization (snapshot embedding `graph_emb` and RSGs of each graph),
# `textrcnn` encoder (state: the embeddings of the last `sequence_length` snapshots, carried
# across graphs like `snapshot_gru`), `predict_snapshot_embedding` objective (L2 error; at
# inference, one score per node = snapshot error x (1 - rank of the node's best RSG / #RSGs)).
#
# Evaluation:
# - `tw_evaluation` (default), as the paper: each time window is a snapshot, scored by its
#   prediction error (the max of its node scores) and flagged above the max validation error.
# - `node_evaluation` (`--evaluation.used_method=node_evaluation`), to compare ProGrapher with the
#   node-level PIDSs on ADP: a node is scored by its key-indicator score in its snapshots (max
#   over windows). `predict_snapshot_embedding.top_k: 4` keeps only the nodes of the top-4 RSGs
#   (the indicators reported by the paper, K = 4 in its Table 10); 0 (default) ranks all nodes.
#
# Differences with the original implementation (no public code is available):
# - snapshots are the time windows of the framework (`construction.time_window_size`), whereas
#   ProGrapher builds snapshots of n nodes (900 on CADETS/THEIA, 300 on CLEARSCOPE) overlapping by
#   1 - fr, with a forgetting rate fr = 1/3 that retires the oldest nodes; lower the window size
#   to get closer to its snapshot sizes;
# - graph2vec is trained on the training snapshots only (`training_split: train`, no data
#   snooping) and the embedding of every snapshot (all splits) is then inferred with the trained
#   RSG vectors; ProGrapher is transductive and learns the embeddings of all snapshots jointly,
#   test included (`--featurization.training_split=all` trains on all of them). RSGs unseen in
#   training are ignored, in the embedding and in the key indicators;
# - gensim truncates documents to 10,000 words: snapshot documents are split into chunks of
#   10,000 RSGs that share the same tag, and their embedding is inferred over all chunks;
# - the TextRCNN is trained with one optimizer step per snapshot (sequence of the previous
#   L snapshots, teacher forcing), and the sequence is carried from the training snapshots to
#   the validation and test ones; with fewer than L previous snapshots, the sequence is shorter;
# - its RNN is a 5-layer bidirectional LSTM (`rnn_type: lstm`, as common TextRCNN code); the
#   paper's equations describe the ReLU recurrence of TextRCNN (`rnn_type: rnn`);
# - the paper evaluates 2-hour graphs (malicious if one of their snapshots is), here each time
#   window is evaluated, and the threshold is the max validation error (the paper's threshold is
#   "pre-defined");
# - the model is selected on validation data (lowest mean validation error, `best_val_score`),
#   as the paper's early stopping (patience of 30 epochs); the paper does not report its
#   number of epochs, 20 are run here (one optimizer step per snapshot, i.e. ~600 steps per
#   epoch on CADETS_E3);
# - ProGrapher only keeps the latest event between a pair of entities: RSGs are built from sets
#   of neighbors and edge types, so repeated events have no effect here (but events of other
#   types between the same pair are kept). As sets, distinct neighbors with the same RSG also
#   count once: an RSG does not reflect how many such neighbors a node has (e.g. a process
#   writing 1 or 1,000 files of the same RSG), unlike the multisets of the original WL kernel.

_include_yml: default

construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  multi_dataset: none
  cleaning:
    used_methods: none
transformation:
  used_methods: none

featurization:
  used_method: graph2vec
  emb_dim: 256  # dimension of the graph embedding
  epochs: 100  # graph2vec training epochs (Section 6.4)
  seed: 0
  training_split: train
  tokenization:
    used_method: none  # graph2vec only uses node and edge types
  graph2vec:
    wl_iterations: 4  # depth d of the WL kernel: 4 on large graphs (CADETS, THEIA), 3 on small ones (CLEARSCOPE)
    negative: 15
    min_count: 1
    alpha: 0.025
    infer_epochs: 100
    num_workers: 1  # several workers make the training of gensim non-deterministic
feat_inference:
  to_remove: True

batching:
  save_on_disk: False
  node_features: node_type
  edge_features: none
  fix_buggy_graph_reindexer: True
  # One graph per snapshot (time window)
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: none
  inter_graph_batching:
    used_method: none

training:
  used_method: default
  seed: 0
  deterministic: False
  num_epochs: 20
  patience: 30
  lr: 0.0003
  weight_decay: 0.0
  node_hid_dim: 128  # hidden size of the anomaly detector
  node_out_dim: 256  # the TextRCNN outputs a graph embedding of size `featurization.emb_dim`
  grad_accumulation: 1
  encoder:
    dropout: 0.2
    used_methods: textrcnn
    textrcnn:
      sequence_length: 128  # L: 128 on CADETS and THEIA, 32 on CLEARSCOPE
      num_layers: 5
      rnn_type: lstm
  decoder:
    used_methods: predict_snapshot_embedding
    predict_snapshot_embedding:
      decoder: none
      top_k: 0

evaluation:
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_val_score
  used_method: tw_evaluation
  tw_evaluation:
    threshold_method: max_val_loss
  node_evaluation:
    threshold_method: max_val_loss
    use_kmeans: False
  node_tw_evaluation:
    threshold_method: max_val_loss
    use_kmeans: False
