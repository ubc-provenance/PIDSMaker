construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  node_label_features:
    subject: path, cmd_line
    file: path
    netflow: remote_ip
  multi_dataset: none
  cleaning:
    # MAGIC keeps one edge per (source, destination, edge type) in a graph (paper, Sec. 4.1)
    used_methods: dedup_window_edges
transformation:
  used_methods: none

featurization:
  used_method: only_type
  tokenization:
    used_method: none
feat_inference:
  to_remove: True

batching:
  save_on_disk: False
  node_features: node_type
  edge_features: edge_type # MAGIC attends over the one-hot edge type
  fix_buggy_graph_reindexer: False
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: none
  inter_graph_batching:
    used_method: none
training:
  used_method: default
  seed: 0
  deterministic: False
  num_epochs: 12
  patience: 3
  lr: 0.001
  weight_decay: 0.0005
  node_hid_dim: 64
  node_out_dim: 64
  grad_accumulation: 1
  encoder:
    dropout: 0.0
    used_methods: magic_gat
    magic_gat:
      num_layers: 3
      num_heads: 4
      negative_slope: 0.2
      alpha_l: 3.0
      activation: prelu
  decoder:
    used_methods: reconstruct_masked_features,predict_masked_struct
    reconstruct_masked_features:
      loss: SCE
      mask_rate: 0.5
      decoder: magic_gat
      magic_gat:
        num_layers: 1
        num_heads: 1
        negative_slope: 0.2
    predict_masked_struct:
      loss: BCE
      decoder: node_mlp
      node_mlp:
        # MAGIC: 2 x 192 (3 concatenated encoder layers) -> 64 -> 1
        architecture_str: linear(0.16666667) | leaky_relu
      balanced_loss: False
      max_samples: 10000 # MAGIC samples min(10000, #nodes) edges and as many non-edges

evaluation:
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_adp
  used_method: node_evaluation
  node_evaluation:
    threshold_method: magic # can't use anything else here
    use_dst_node_loss: True
    magic_knn_k: 10 # k-NN on the benign training embeddings, as in MAGIC
    magic_max_reference_size: 0 # 0: all the training node embeddings
    magic_embedding: concat # all encoder layers, as in the paper (the code scores the last one)
