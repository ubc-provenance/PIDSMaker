construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  consistent_edge_types: False
  # Edge attribute used as edge type: `operation` (default event type) or a categorical
  # edge attribute of the dataset schema (e.g. `logon_type` for LANL)
  edge_type: operation
  operations: default
  drop_noise_events: True
  benign_training: True
  multi_dataset: none
  node_label_features:
    subject: type, path, cmd_line
    file: type, path
    netflow: type, remote_ip, remote_port
    host: name
  # Cleaning of the raw data before building the graphs (see docs/docs/config/cleaning.md).
  # `none` builds the graphs of the original systems.
  cleaning:
    used_methods: none
    normalize_labels:
      collapse_whitespace: True
      collapse_slashes: True
      strip_path_prefixes: True
      strip_quotes: True
      lowercase: False
      max_length: 512
    remove_noisy_netflows:
      ip_categories: multicast, broadcast
transformation:
  used_methods: none
  synthetic_attack_naive:
    num_attacks: 1
    num_malicious_process: 5
    num_unauthorized_file_access: 20
    process_selection_method: random # TODO: try new methods

featurization:
  temporal_rw:
    walk_length: 30
    num_walks: 10
    trw_workers: 8
    time_weight: uniform
    half_life: 1
    window_size: 5
    min_count: 1
    use_skip_gram: True
    wv_workers: 6
    compute_loss: True
    negative: 5
    decline_rate: 30
  doc2vec:
    include_neighbors: False
    truncate_process_name: False
    alpha: 0.025
    workers: 3
  alacarte:
    walk_length: 30
    num_walks: 10
    context_window_size: 5
    min_count: 0
    use_skip_gram: True
    num_workers: 1
    compute_loss: True
    add_paths: False
  word2vec:
    alpha: 0.025
    window_size: 5
    min_count: 1
    use_skip_gram: True
    num_workers: 1
    compute_loss: True
    negative: 5
    decline_rate: 30
  fasttext:
    min_count: 2
    alpha: 0.01
    window_size: 3
    negative: 3
    num_workers: 1
    use_pretrained_fb_model: False
  flash:
    min_count: 1
    workers: 1
  graph2vec:  # ProGrapher
    wl_iterations: 4
    negative: 15
    min_count: 1
    alpha: 0.025
    infer_epochs: 100
    num_workers: 1  # several workers make the training of gensim non-deterministic
  # Default parameters of each tokenization. Systems set `tokenization.used_method`.
  # `substitutions` lists the values replaced by placeholder tokens ([HASH], [NUM], ...), or `none`.
  tokenization:
    nltk:
      type_aware: True
      substitutions: none
    hierarchical:
      substitutions: none
    whole_label:
      substitutions: none
    bpe:
      vocab_size: 8000
      max_seq_len: 60
      mode: domain_bpe
      substitutions: hash, guid, random, version, timestamp, env_var, number, ip, port
      canonicalize_neighbors: False
    huggingface:
      model_name: openai-community/gpt2
      max_seq_len: 64
      substitutions: none
feat_inference:
  edge_attributes: all
  to_remove: True

training:
  # ThreaTrace (`used_method: threatrace` and `threshold_method: threatrace`)
  threatrace:
    ratio_threshold: 1.5
    max_submodels: 100
    max_retrain_epochs: 149
    retrain_loss_threshold: 1.0
    max_rounds_without_progress: 3
  encoder:
    x_is_tuple: False
    graph_attention:
      activation: relu
      num_heads: 8
      concat: True
      flow: source_to_target
      num_layers: 2
    hetero_graph_transformer:
      activation: relu
      num_heads: 4
      num_layers: 1
    tgn:
      tgn_memory_dim: 100
      tgn_time_dim: 100
      use_node_feats_in_gnn: True
      use_memory: False
      use_time_order_encoding: False
      project_src_dst: True
      mode: classic
      use_residual_norm: False
    sage:
      activation: relu
      num_layers: 2
    gat:
      activation: relu
      num_heads: 8
      concat: True
      flow: source_to_target
      num_layers: 2
    gin:
      activation: relu
      num_layers: 2
    rgcn:
      activation: relu
      num_layers: 2
    rgcn_per_type:
      activation: relu
      num_layers: 2
    magic_gat:
      num_layers: 3
      num_heads: 4
      negative_slope: 0.2
      alpha_l: 3.0
      activation: prelu
    rcaid_gat:
      num_layers: 2
      num_heads: 1
    custom_mlp:
      architecture_str: none
    gcn:
      activation: relu
      num_layers: 2
    node_id_embedding:
      dim: 32
      all_nodes: False
    snapshot_gru:
      hidden_dim: 0  # 0: node_out_dim
      dropout: 0.0
    egraphsage:
      activation: relu
      num_layers: 2
      undirected: True
    argus:
      num_layers: 2
    lares:
      flow: target_to_source
      use_node_features: False
    shadewatcher:
      hidden_dims: 32,16
      kg_dim: 32
      kg_neg_ratio: 2
      kg_margin: 1.0
    textrcnn:  # ProGrapher
      sequence_length: 128
      num_layers: 5
      rnn_type: lstm
  decoder:
    predict_edge_supervised:
      decoder: edge_mlp
      mode: patterns  # scores / patterns / synthetic
      top_n_attacks: 20
      attack_patterns: []
      max_edges_per_pattern: 20
      attack_edges_path: none
      pos_weight: 1.0
      edge_mlp:
        architecture_str: linear(0.5) | relu
        src_dst_projection_coef: 2
    predict_edge_type:
      loss: cross_entropy
      decoder: edge_mlp
      use_triplet_types: False
      edge_mlp:
        architecture_str: linear(0.5) | relu
        src_dst_projection_coef: 2
    predict_node_type:
      decoder: node_mlp
      balanced_loss: False
      flash_snapshots: False
      flash_drop_conf: 0.9
      node_mlp:
        architecture_str: none
    reconstruct_node_features:
      loss: MSE
      decoder: node_mlp
      node_mlp:
        architecture_str: none
    reconstruct_node_embeddings:
      loss: MSE
      decoder: node_mlp
      node_mlp:
        architecture_str: none
    reconstruct_edge_embeddings:
      loss: MSE
      decoder: edge_mlp
      edge_mlp:
        architecture_str: linear(0.5) | relu | linear(0.5) | relu | linear(0.5) | relu
        src_dst_projection_coef: 1
    predict_edge_contrastive:
      loss: bce
      ap_margin: 0.8
      neg_sampling: shuffle_dst
      neg_ratio: 1.0
      decoder: inner_product
      inner_product:
        dropout: 0.0
      edge_mlp:
        architecture_str: linear(0.5) | relu
        src_dst_projection_coef: 1
    
    deep_graph_infomax:
      decoder: none
      pca_components: 8
    autoencode_edge_embeddings:
      decoder: none
      use_edge_feats: True
    predict_snapshot_embedding:  # ProGrapher
      decoder: none
      top_k: 0
    few_shot:
      include_attacks_in_ssl_training: False
      freeze_encoder: True
      num_epochs_few_shot: 50
      patience_few_shot: 5
      lr_few_shot: 0.001
      weight_decay_few_shot: 0.00001
      decoder:
        used_methods: detect_edge_few_shot
        detect_edge_few_shot:
          decoder: edge_mlp # node_mlp
          node_mlp:
            architecture_str: linear(1.0) | relu
          edge_mlp:
            architecture_str: linear(0.5) | relu
            src_dst_projection_coef: 1

evaluation:
  best_model_selection: best_adp
  save_figures: True
  evaluate_selected_epoch_only: False
  host_two_stage_evaluation:
    alpha: 3
    beta: 350
    root_attack_nodes: ""
    test_end: ""
  node_evaluation:
    threshold_method: max_val_loss
    max_val_loss:
      alpha: 1.0
    use_dst_node_loss: True
    use_kmeans: True
    kmeans_top_K: 30
  tw_evaluation:
    threshold_method: max_val_loss
  node_tw_evaluation:
    threshold_method: max_val_loss
    use_dst_node_loss: True
    use_kmeans: True
    kmeans_top_K: 3
  queue_evaluation:
    queue_threshold: 20
    used_method: kairos_idf_queue
    kairos_idf_queue:
      include_test_set_in_IDF: True
  edge_evaluation:
    malicious_edge_selection: src_node
    threshold_method: max_val_loss
