# Kairos (Cheng et al., IEEE S&P 2024): "KAIROS: Practical Intrusion Detection and Investigation
# using Whole-system Provenance". A TGN (node memory + graph attention over the last neighbors) on
# hierarchically hashed node labels, trained to predict the type of each edge; edges whose type is
# badly predicted are anomalous.
#
# As in the original implementation (https://github.com/ProvenanceAnalytics/kairos): messages are
# (src, edge type, dst), TransformerConv with 8 heads then 1 head, both followed by a ReLU, a decoder
# with dropout 0.5, and the memory and neighbors are reset every day.
#
# Differences with the original implementation:
# - nodes are scored by their largest edge loss and evaluated at node level, instead of time windows
#   whose anomalous edges (above mean + 1.5 std of the window) are grouped into IDF queues;
# - 12 epochs and the best evaluated epoch, instead of 50 (E3) or 30 (E5) epochs;
# - consecutive identical events between two nodes are fused (`fuse_edge`), and all the edge types
#   of the dataset are kept (7 in the code of CADETS_E3);
# - each level of a path or IP is a hashed token, as in the paper (the code hashes the characters of
#   the concatenated levels), the vectors are L2-normalized, and the node type is a one-hot feature.

construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 15.0
  use_hashed_label: False
  fuse_edge: True
  node_label_features:
    subject: path
    file: path
    netflow: remote_ip, remote_port
  multi_dataset: none
  cleaning:
    used_methods: none
transformation:
  used_methods: none

featurization:
  emb_dim: 16
  training_split: all
  used_method: hierarchical_hashing
  tokenization:
    used_method: hierarchical
    hierarchical:
      substitutions: none
feat_inference:
  to_remove: True

batching:
  compact_node_ids: True
  save_on_disk: False
  node_features: node_emb,node_type
  edge_features: msg,time_encoding
  fix_buggy_graph_reindexer: False
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: edges, tgn_last_neighbor
    edges:
      intra_graph_batch_size: 1024
    tgn_last_neighbor:
      tgn_neighbor_size: 20
      tgn_neighbor_n_hop: 1
      fix_buggy_orthrus_TGN: False
      fix_tgn_neighbor_loader: False
      directed: False
      insert_neighbors_before: False
      reset_state_every_day: True
  inter_graph_batching:
    used_method: none
training:
  used_method: default
  seed: 0
  deterministic: False
  num_epochs: 12
  patience: 3
  lr: 0.00005
  weight_decay: 0.01
  node_hid_dim: 100
  node_out_dim: 100
  grad_accumulation: 1
  encoder:
    dropout: 0.0
    used_methods: graph_attention,tgn
    graph_attention:
      activation: relu
      num_heads: 8
      concat: True
      flow: source_to_target
      num_layers: 2
      final_activation: True
    tgn:
      tgn_memory_dim: 100
      tgn_time_dim: 100
      use_node_feats_in_gnn: False
      use_memory: True
      use_time_order_encoding: False
      project_src_dst: True
  decoder:
    used_methods: predict_edge_type
    predict_edge_type:
      balanced_loss: False
      use_triplet_types: False
      edge_type_in_msg: True
      decoder: edge_mlp
      edge_mlp:
        architecture_str: linear(2) | dropout(0.5) | tanh | linear(0.25) | dropout(0.5) | tanh | linear(0.25) | dropout(0.5) | tanh
        src_dst_projection_coef: 2

evaluation:
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_adp
  used_method: node_evaluation
  node_evaluation:
    threshold_method: max_val_loss
    use_dst_node_loss: True
    use_kmeans: False
  queue_evaluation:
    queue_threshold: 20
    used_method: kairos_idf_queue
    kairos_idf_queue:
      include_test_set_in_IDF: True
