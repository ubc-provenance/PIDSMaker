# LARES (Bilot et al., ACSAC 2026): "LARES: Host-centered Lateral Movement Detection via
# Inductive Graph Reasoning". Repeated edges of each snapshot are merged, a single
# sum-aggregation layer embeds hosts from their identity and from the features of their edges,
# and an autoencoder reconstructs the embeddings of edges. A host is scored by the maximum
# reconstruction error of its outgoing edges, and the top-scored hosts are clustered (K-means)
# to keep the most anomalous ones.
#
# As in LARES, edge features are the number of events of each merged edge and their counts per
# attribute value (e.g. successful/failed logons, kinds of users), standardized per snapshot
# (`merge_edges.aggregate_attributes`); hosts are embedded from their ID only, and edge
# embeddings combine the embeddings of their endpoints with their own features through a gated
# skip connection before being reconstructed (`autoencode_edge_embeddings`).
#
# The evaluation is LARES' two-stage host-centered evaluation (`host_two_stage_evaluation`):
# hosts are scored by the maximum loss of their outgoing edges over the test period, the top
# cluster of the α=3 highest scores is selected (K-means), and the β=350 top outgoing edges of
# each selected host are predicted malicious; positives are the malicious edges of the root
# source of the attacks (`root_attack_nodes` of the dataset). As the original code, the best
# epoch is selected on the MCC of the test set (`best_mcc`).
#
# Differences with the original implementation:
# - hosts aggregate the messages of their incoming edges (`source_to_target`), whereas the code
#   of LARES defaults to their outgoing edges (`target_to_source`): on LANL, the latter ranks
#   the root attacker much lower in our experiments;
# - LARES evaluates LANL on its first 14 days only (set
#   `evaluation.host_two_stage_evaluation.test_end="2015-01-15 06:05:15"` to do the same).
#
# On LANL with the 14-day test period, the best epoch reaches MCC 0.56-0.64 on 2 of 3 seeds
# (paper: 0.65); as in the original, whether the first stage selects the root attacker depends
# on the seed and the epoch, while edge-level AUC is ~0.99 across seeds.

_include_yml: default

construction:
  used_method: default
  use_all_files: True
  mimicry_edge_num: 0
  time_window_size: 60.0
  use_hashed_label: False
  fuse_edge: False
  multi_dataset: none
  cleaning:
    used_methods: remove_self_loops
transformation:
  used_methods: merge_edges
  merge_edges:
    per_edge_type: False
    aggregate_attributes: True

featurization:
  emb_dim: 16
  training_split: train
  used_method: only_type
  tokenization:
    used_method: none
feat_inference:
  to_remove: True
  # Edge features of LARES: numbers of successful and failed logons (LANL), of each protocol and
  # port (OpTC), along with the number of events of each merged edge
  edge_attributes: LANL:success;OPTC_NET:src_port,dst_port,protocol

batching:
  node_features: node_type
  edge_features: edge_attrs
  fix_buggy_graph_reindexer: True
  global_batching:
    used_method: none
  intra_graph_batching:
    used_methods: none
  inter_graph_batching:
    used_method: none

training:
  used_method: default
  seed: 0
  deterministic: False
  num_epochs: 10
  patience: 3
  lr: 0.0001
  weight_decay: 0.0
  node_hid_dim: 64
  node_out_dim: 32
  grad_accumulation: 1
  encoder:
    dropout: 0.25
    used_methods: lares
    lares:
      # Hosts aggregate the messages of the sources of their incoming edges (more stable on LANL
      # than LARES' default target_to_source, see the header)
      flow: source_to_target
      use_node_features: False
  decoder:
    used_methods: autoencode_edge_embeddings
    autoencode_edge_embeddings:
      decoder: none
      use_edge_feats: True

evaluation:
  # Disabled until the NIDS reach their published performance (one point per edge is slow)
  save_figures: False
  viz_malicious_nodes: False
  ground_truth_version: orthrus
  best_model_selection: best_mcc
  used_method: host_two_stage_evaluation
  host_two_stage_evaluation:
    alpha: 3
    beta: 350
    root_attack_nodes: dataset
  node_evaluation:
    threshold_method: max_val_loss
    max_val_loss:
      alpha: 1.0
    use_dst_node_loss: False
    use_kmeans: True
    kmeans_top_K: 5
